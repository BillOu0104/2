name: Verify version and analysis records
on:
  push:
    branches: [main, 'release/**', 'fix/**', 'feature/**', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/records.py check
